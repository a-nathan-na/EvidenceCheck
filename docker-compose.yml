services:
  backend:
    build: ./backend
    container_name: evidencecheck-backend
    ports:
      - "8000:8000"
    environment:
      - EVIDENCECHECK_CORS_ORIGINS=http://localhost:3000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Vite inlines this at build time, so it is a build arg rather than a
        # runtime environment variable.
        VITE_API_URL: http://localhost:8000
    container_name: evidencecheck-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
